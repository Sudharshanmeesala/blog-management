<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Blog - Blog Management</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <!-- ===== NAVIGATION ===== -->
    <nav>
        <div class="container">
            <div class="logo">Blog<span>Hub</span></div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="add-blog.html" class="active">+ Add Blog</a>
            </div>
        </div>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="container">
        <h1 class="page-title">✍️ Create New Post</h1>
        <p class="subtitle">Share your ideas with the world. Fill in the details below.</p>

        <div class="form-card">
            <form id="blog-form">
                <!-- Title -->
                <div class="form-group">
                    <label for="title">📌 Blog Title</label>
                    <input type="text" id="title" placeholder="e.g. My First Blog Post" required />
                </div>

                <!-- Content -->
                <div class="form-group">
                    <label for="content">📝 Content</label>
                    <textarea id="content" placeholder="Write your amazing content here..." required></textarea>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-primary">🚀 Publish Blog</button>
            </form>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer>
        <div class="container">
            <p>&copy; 2026 BlogHub. Built with ❤️ for the Codomax Internship.</p>
            <div class="footer-links">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Contact</a>
            </div>
        </div>
    </footer>
<script src="script.js"></script>
<form>
  <div id="error-message" style="color: red; margin-bottom: 1rem;"></div>
<button type="submit">Submit</button>
</form>

</body>
</html>
