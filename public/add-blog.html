<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Blog</title>
</head>
<body>

  <!-- ===== NAVIGATION BAR ===== -->
  <nav>
    <a href="index.html">🏠 Home</a>
    <a href="add-blog.html">➕ Add Blog</a>
  </nav>

  <!-- ===== MAIN CONTENT ===== -->
  <main>
    <h1>Add a New Blog Post</h1>
    <form id="blog-form">
      <div>
        <label for="title">Title:</label>
        <input type="text" id="title" placeholder="Enter blog title" required />
      </div>
      <div>
        <label for="content">Content:</label>
        <textarea id="content" rows="6" placeholder="Write your blog content..." required></textarea>
      </div>
      <button type="submit">Publish Blog</button>
    </form>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    <p>&copy; 2026 Blog Management System. All rights reserved.</p>
  </footer>

</body>
</html>
